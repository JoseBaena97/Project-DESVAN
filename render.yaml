# Blueprint de Render para El Desván
# Referencia: https://render.com/docs/blueprint-spec
services:
  - type: web
    region: ohio
    name: el-desvan
    env: python
    buildCommand: "./render_build.sh"
    startCommand: "flask --app src/app.py db upgrade && gunicorn wsgi --chdir ./src/"
    plan: free
    numInstances: 1
    envVars:
      - key: VITE_BASENAME
        value: /
      - key: FLASK_APP
        value: src/app.py
      - key: FLASK_DEBUG
        value: 0
      - key: FLASK_APP_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.6
      - key: DATABASE_URL
        fromDatabase:
          name: postgresql-trapezoidal-42170
          property: connectionString

databases:
  - name: postgresql-trapezoidal-42170
    region: ohio
    ipAllowList: [] # solo conexiones internas
    plan: free
